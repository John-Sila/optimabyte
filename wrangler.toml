name = "optimabyte-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Where new-request emails are sent. With Resend's free test sender this must be
# the same address you signed up to Resend with.
NOTIFY_TO = "optimabyte@gmail.com"
NOTIFY_FROM = "OptimaByte <onboarding@resend.dev>"
# Your live site origin(s), comma separated, no trailing slash. Edit this!
ALLOWED_ORIGINS = "https://optimabyte.vercel.app,http://localhost:5173"

# Secret (do not put here): run `npx wrangler secret put RESEND_API_KEY`
